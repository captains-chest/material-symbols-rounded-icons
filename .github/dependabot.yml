version: 2
updates:
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/projects/material-symbols-rounded-icons"
      - "/projects/material-symbols-rounded-icons-filled"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Europe/Copenhagen"
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Minor and patch updates are grouped. Major updates (including Angular
      # majors: @angular/*, @angular-devkit/*, @schematics/angular, ng-packagr)
      # are never grouped and arrive as separate PRs.
      npm-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Europe/Copenhagen"
    commit-message:
      prefix: "chore(deps)"
    groups:
      github-actions-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
