name: Publish packages

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish dual packages with provenance
    runs-on: ubuntu-latest
    environment: npm-publish
    if: github.repository_owner == 'captains-chest'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Verify release tag matches package versions
        run: node tools/release/verify-lockstep-version.mjs "$GITHUB_REF_NAME"

      - name: Run release checks
        run: npm run release:check

      - name: Publish outline package
        run: npm publish --access public --provenance
        working-directory: dist/material-symbols-rounded-icons
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish filled package
        run: npm publish --access public --provenance
        working-directory: dist/material-symbols-rounded-icons-filled
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
